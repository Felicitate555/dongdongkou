# Save as /etc/nginx/sites-available/dongdongkou after issuing the TLS certificate.
limit_req_zone $binary_remote_addr zone=dongdongko_ai:10m rate=30r/m;

server {
    listen 80;
    server_name dongdongko.fun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dongdongko.fun;

    ssl_certificate     /etc/letsencrypt/live/dongdongko.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dongdongko.fun/privkey.pem;

    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/ai_assist {
        limit_req zone=dongdongko_ai burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
